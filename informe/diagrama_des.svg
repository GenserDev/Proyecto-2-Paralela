<svg viewBox="0 0 980 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="900" fill="#ffffff"/>

  <text x="490" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Diagrama de flujo del algoritmo DES</text>

  <!-- Columna izquierda: flujo general -->
  <rect x="60" y="70" width="260" height="50" rx="8" fill="#dbe9f7" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="190" y="100" text-anchor="middle" font-size="15">Texto plano (bloque de 64 bits)</text>

  <line x1="190" y1="120" x2="190" y2="150" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/>

  <rect x="60" y="150" width="260" height="50" rx="8" fill="#dbe9f7" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="190" y="180" text-anchor="middle" font-size="15">Permutacion inicial (IP)</text>

  <line x1="190" y1="200" x2="190" y2="230" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/>

  <rect x="60" y="230" width="260" height="60" rx="8" fill="#fef3c7" stroke="#b7791f" stroke-width="1.5"/>
  <text x="190" y="255" text-anchor="middle" font-size="15">16 rondas Feistel</text>
  <text x="190" y="275" text-anchor="middle" font-size="12" fill="#555555">(una subllave distinta por ronda)</text>

  <line x1="190" y1="290" x2="190" y2="320" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/>

  <rect x="60" y="320" width="260" height="50" rx="8" fill="#dbe9f7" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="190" y="350" text-anchor="middle" font-size="15">Intercambio final de mitades</text>

  <line x1="190" y1="370" x2="190" y2="400" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/>

  <rect x="60" y="400" width="260" height="50" rx="8" fill="#dbe9f7" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="190" y="430" text-anchor="middle" font-size="15">Permutacion final (IP inversa)</text>

  <line x1="190" y1="450" x2="190" y2="480" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/>

  <rect x="60" y="480" width="260" height="50" rx="8" fill="#d6f5d6" stroke="#2f855a" stroke-width="1.5"/>
  <text x="190" y="510" text-anchor="middle" font-size="15">Texto cifrado (64 bits)</text>

  <!-- Llave -->
  <rect x="60" y="560" width="260" height="50" rx="8" fill="#f3e8ff" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="190" y="590" text-anchor="middle" font-size="15">Llave de 64 bits (56 utiles)</text>

  <line x1="190" y1="610" x2="190" y2="640" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/>

  <rect x="60" y="640" width="260" height="50" rx="8" fill="#f3e8ff" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="190" y="670" text-anchor="middle" font-size="15">Descarte de bits de paridad</text>

  <line x1="190" y1="690" x2="190" y2="720" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/>

  <rect x="60" y="720" width="260" height="60" rx="8" fill="#f3e8ff" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="190" y="745" text-anchor="middle" font-size="15">Generacion de 16 subllaves</text>
  <text x="190" y="763" text-anchor="middle" font-size="12" fill="#555555">(rotaciones y permutaciones)</text>

  <line x1="320" y1="750" x2="500" y2="260" stroke="#6b46c1" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#flecha)"/>
  <text x="440" y="500" font-size="12" fill="#6b46c1" transform="rotate(-58 440 500)">una subllave entra en cada ronda</text>

  <!-- Columna derecha: detalle de una ronda -->
  <rect x="520" y="70" width="400" height="30" fill="none"/>
  <text x="720" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Detalle de una ronda Feistel</text>

  <rect x="560" y="120" width="140" height="45" rx="6" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.3"/>
  <text x="630" y="147" text-anchor="middle" font-size="13">Mitad izquierda (L)</text>

  <rect x="740" y="120" width="140" height="45" rx="6" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.3"/>
  <text x="810" y="147" text-anchor="middle" font-size="13">Mitad derecha (R)</text>

  <line x1="810" y1="165" x2="810" y2="195" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/>

  <rect x="740" y="195" width="140" height="40" rx="6" fill="#fef3c7" stroke="#b7791f" stroke-width="1.3"/>
  <text x="810" y="219" text-anchor="middle" font-size="13">Expansion a 48 bits</text>

  <line x1="810" y1="235" x2="810" y2="265" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/>

  <rect x="740" y="265" width="140" height="40" rx="6" fill="#fef3c7" stroke="#b7791f" stroke-width="1.3"/>
  <text x="810" y="289" text-anchor="middle" font-size="13">XOR con la subllave</text>

  <line x1="810" y1="305" x2="810" y2="335" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/>

  <rect x="740" y="335" width="140" height="40" rx="6" fill="#fef3c7" stroke="#b7791f" stroke-width="1.3"/>
  <text x="810" y="359" text-anchor="middle" font-size="13">Sustitucion en cajas S</text>

  <line x1="810" y1="375" x2="810" y2="405" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/>

  <rect x="740" y="405" width="140" height="40" rx="6" fill="#fef3c7" stroke="#b7791f" stroke-width="1.3"/>
  <text x="810" y="429" text-anchor="middle" font-size="13">Permutacion P</text>

  <line x1="740" y1="425" x2="650" y2="470" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="630" y1="165" x2="630" y2="450" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/>

  <rect x="560" y="450" width="140" height="45" rx="6" fill="#d6f5d6" stroke="#2f855a" stroke-width="1.3"/>
  <text x="630" y="470" text-anchor="middle" font-size="12">XOR de L</text>
  <text x="630" y="486" text-anchor="middle" font-size="12">con el resultado</text>

  <line x1="630" y1="495" x2="630" y2="525" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="810" y1="120" x2="700" y2="525" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/>

  <rect x="560" y="525" width="320" height="55" rx="6" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.3"/>
  <text x="720" y="548" text-anchor="middle" font-size="13">Nueva L = R anterior</text>
  <text x="720" y="566" text-anchor="middle" font-size="13">Nueva R = L XOR f(R, subllave)</text>

  <text x="720" y="610" text-anchor="middle" font-size="12" fill="#555555">Este bloque se repite 16 veces, una por cada subllave</text>

  <!-- Nota final -->
  <rect x="60" y="800" width="860" height="70" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.3"/>
  <text x="490" y="825" text-anchor="middle" font-size="13" fill="#742a2a">Para descifrar se usa el mismo algoritmo</text>
  <text x="490" y="845" text-anchor="middle" font-size="13" fill="#742a2a">solo que las 16 subllaves se aplican en orden inverso</text>
</svg>
